<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Product Management</title>

    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 40px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #222;
    color: white;
}

#message {
    margin: 15px 0;
}

.search-box {
    margin: 20px 0;
}

.search-box input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: left;
}

th {
    background: #f1f1f1;
}

.delete-btn {
    background: crimson;
}

.success {
    color: green;
}

.error {
    color: red;
}
</style>
<body>

    <div class="container">

        <h1>Mini Product Management</h1>

        <!-- Product Form -->
        <form id="productForm">

            <div class="form-group">
                <label>Product Name</label>
                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                >
            </div>

            <div class="form-group">
                <label>Price</label>
                <input
                    type="number"
                    id="productPrice"
                    placeholder="Enter price"
                >
            </div>

            <button type="submit" id="addBtn">
                Add Product
            </button>

        </form>

        <!-- Message -->
        <p id="message"></p>

        <!-- Search -->
        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="Search product..."
            >
        </div>

        <!-- Product Table -->
        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="productList">

                <!-- Products will be added here -->

            </tbody>

        </table>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Our JavaScript -->
    <script src="app.js"></script>

</body>
</html>
