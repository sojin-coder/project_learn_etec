<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Tailwind CSS CDN សម្រាប់ដេគ័រម៉ូត -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8 font-sans">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Form Section -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-md border border-slate-700">
            <h2 class="text-xl font-bold mb-4 text-emerald-400">Add Product</h2>
            
            <form id="productForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-slate-400">Title</label>
                    <input type="text" id="title" placeholder="title" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-1 text-slate-400">Price</label>
                        <input type="number" id="price" placeholder="price" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-400">Quantity</label>
                        <input type="number" id="qty" placeholder="qty" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm mb-1 text-slate-400">Image</label>
                    <input type="file" id="image" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
                </div>

                <div>
                    <img id="preview" width="100px" class="rounded border border-slate-600 my-2"> 
                </div>

                <div>
                    <label class="block text-sm mb-1 text-slate-400">Description</label>
                    <textarea id="descript" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded transition">submit</button>
            </form>
        </div>

        <!-- Table Section -->
        <main class="bg-slate-800 rounded-xl shadow-md border border-slate-700 overflow-hidden">
            <table border="1" class="w-full text-left border-collapse text-sm text-slate-300">
                <thead class="bg-slate-700 text-slate-200">
                    <tr>
                        <th class="p-3 border border-slate-600">id</th>
                        <th class="p-3 border border-slate-600">title</th>
                        <th class="p-3 border border-slate-600">price</th>
                        <th class="p-3 border border-slate-600">qty</th>
                        <th class="p-3 border border-slate-600">image</th>
                        <th class="p-3 border border-slate-600">description</th>
                        <th class="p-3 border border-slate-600">action</th>
                    </tr>
                </thead>
                <tbody id="display">

                </tbody>
            </table>
        </main>

    </div>

</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
       $(document).ready(function(){
          $('#image').on('change', function(){
            $('#preview').attr('src',URL.createObjectURL(this.files[0]));

          })

          function clearForm(){
            $('#preview').attr('src','');
            $('#productForm')[0].reset();
          }

          $('#productForm').on('submit',function(e){
            e.preventDefault();
            let formData = new FormData();
            formData.append('id',1);
            formData.append('title',$('#title').val());
            formData.append('price',$('#price').val());
            formData.append('qty',$('#qty').val());
            formData.append('description',$('#descript').val());
            formData.append('image',$('#image')[0].files[0]);

            let file = formData.get('image');
            let imageURL = URL.createObjectURL(file);

            $('#display').html(`
               <tr>
                   <td class="p-3 border border-slate-600">${formData.get('id')}</td> 
                   <td class="p-3 border border-slate-600">${formData.get('title')}</td> 
                   <td class="p-3 border border-slate-600">${formData.get('price')}</td> 
                   <td class="p-3 border border-slate-600">${formData.get('qty')}</td>
                   <td class="p-3 border border-slate-600">
                     <img src='${imageURL}' width="100px" class="rounded" /> 
                   </td> 
                   <td class="p-3 border border-slate-600">${formData.get('description')}</td>
                   <td class="p-3 border border-slate-600 space-x-1">
                      <button class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1 rounded text-xs">view</button>
                      <button class="bg-amber-600 hover:bg-amber-500 text-white px-2 py-1 rounded text-xs">edit</button>
                      <button class="bg-red-600 hover:bg-red-500 text-white px-2 py-1 rounded text-xs">delete</button>
                   </td>
               </tr>
            
            `);
            clearForm();
          })

          
       });
</script>
</html>
